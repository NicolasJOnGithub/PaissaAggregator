services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-paissa}
      POSTGRES_USER: ${DB_USER:-paissa}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-paissa}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-paissa} -d ${DB_NAME:-paissa}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-paissa}
      DB_USER: ${DB_USER:-paissa}
      DB_PASSWORD: ${DB_PASSWORD:-paissa}
      REFRESH_KEY: ${REFRESH_KEY:?set REFRESH_KEY in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    restart: unless-stopped

volumes:
  postgres_data:
