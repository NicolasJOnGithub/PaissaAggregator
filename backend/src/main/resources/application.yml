spring:
  application:
    name: paissa-aggregator
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/paissa}
    username: ${DB_USER:paissa}
    password: ${DB_PASSWORD:paissa}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

paissa:
  api:
    base-url: ${PAISSA_BASE_URL:https://paissadb.zhu.codes}
  refresh:
    key: ${REFRESH_KEY:changeme}
    # PAISSADB's own rate limit (~1 req/10s, enforced via 429 + Retry-After) already paces successful
    # requests to roughly this cadence, so a full 85-world sync realistically takes ~15 minutes.
    fixed-delay-ms: ${REFRESH_FIXED_DELAY_MS:1800000}
    initial-delay-ms: ${REFRESH_INITIAL_DELAY_MS:0}
    request-pacing-ms: ${REFRESH_REQUEST_PACING_MS:300}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

logging:
  level:
    com.paissa.aggregator: INFO
